[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dropbox-mcp"
version = "0.1.0"
description = "MCP server exposing Dropbox tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.0.0",
    "dropbox>=12.0.2",
    "python-dotenv>=1.0.0",
]

[project.scripts]
dropbox-mcp = "dropbox_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
